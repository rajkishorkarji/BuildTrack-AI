spring.application.name=buildtrack-ai
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/buildtrack_ai
spring.datasource.username=buildtrack
spring.datasource.password=buildtrack_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.frontend-url=http://localhost:5173
app.jwt-secret=MyBuildTrackSecretKey12345678901234567890
app.jwt-expiration-ms=86400000

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@buildtrack.ai}
spring.mail.password=${MAIL_PASSWORD:secret_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OAuth2 Google Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile