spring.application.name=buildtrack-ai
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/buildtrack_ai
spring.datasource.username=buildtrack
spring.datasource.password=buildtrack_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.frontend-url=http://localhost:5173
app.jwt-secret=MyBuildTrackSecretKey12345678901234567890
app.jwt-expiration-ms=86400000