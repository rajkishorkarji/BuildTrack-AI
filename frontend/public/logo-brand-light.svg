    <rect x="26" y="65" width="16" height="35" rx="6" fill="#64748B"/>
    <rect x="48" y="45" width="16" height="55" rx="6" fill="#3B82F6"/>
    <rect x="70" y="30" width="16" height="70" rx="6" fill="url(#accent-grad)"/>
    <path d="M 48 35 L 86 18 L 100 18" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="18" r="5" fill="#F59E0B"/>
    <circle cx="78" cy="22" r="6" fill="#10B981"/>
  </g>
  <g transform="translate(150, 88)">
