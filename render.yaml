services:
  # ============================================================
  # 1. Spring Boot Backend API (Free Web Service)
  # ============================================================
  - type: web
    name: buildtrack-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: buildtrack-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: buildtrack-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: buildtrack-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: admin@buildtrack.ai
      - key: SUPER_ADMIN_PASSWORD
        value: ChangeMeNow!123
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -Xss512k -XX:MaxRAMPercentage=75.0"
      - key: KAFKA_AUTO_STARTUP
        value: "false"
      - key: FRONTEND_URL
        value: "https://buildtrack-frontend-3sl8.onrender.com"
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: rajkishorkarji07@gmail.com
      - key: MAIL_PASSWORD
        value: "bpnixcfjjxzrqiul"

  # ============================================================
  # 2. React SPA Frontend (Free Static Site)
  # ============================================================
  - type: web
    name: buildtrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: buildtrack-backend
          property: host

# ============================================================
# 3. Free PostgreSQL Database
# ============================================================
databases:
  - name: buildtrack-db
    plan: free
    region: singapore
    databaseName: buildtrack_ai
    user: buildtrack
