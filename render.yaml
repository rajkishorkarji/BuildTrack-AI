services:
  # ============================================================
  # 1. Spring Boot Backend API (Free Web Service)
  # ============================================================
  - type: web
    name: buildtrack-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: buildtrack-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: buildtrack-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: buildtrack-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        value: admin@buildtrack.ai
      - key: SUPER_ADMIN_PASSWORD
        value: ChangeMeNow!123

  # ============================================================
  # 2. React SPA Frontend (Free Static Site)
  # ============================================================
  - type: web
    name: buildtrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ============================================================
# 3. Free PostgreSQL Database
# ============================================================
databases:
  - name: buildtrack-db
    plan: free
    region: singapore
    databaseName: buildtrack_ai
    user: buildtrack
